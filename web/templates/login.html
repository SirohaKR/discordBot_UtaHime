{% extends "base.html" %}
{% block title %}로그인 — 랑다AI 설정{% endblock %}
{% block content %}
<div class="card" style="max-width:320px;margin:60px auto;">
  <h2>🔒 로그인</h2>
  <p class="desc">비밀번호를 입력하면 설정 페이지로 들어갑니다.</p>
  {% if error %}
  <p style="color:var(--danger);font-size:13px;margin-top:4px;">비밀번호가 틀렸습니다.</p>
  {% endif %}
  <form method="post">
    <label>비밀번호</label>
    <input type="password" name="password" autofocus required>
    <button type="submit">입장</button>
  </form>
</div>
{% endblock %}
