<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공주님 봇 설정</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; background:#0f1115; color:#e6e6e6;
         display:flex; justify-content:center; padding:40px 16px; margin:0; }
  .card { background:#1a1d24; border-radius:12px; padding:32px; width:100%; max-width:420px;
          box-shadow:0 4px 24px rgba(0,0,0,.3); }
  h1 { font-size:1.3rem; margin-top:0; }
  a { color:#7dd3fc; text-decoration:none; }
  a:hover { text-decoration:underline; }
  ul { padding-left:1.2rem; }
  code { background:#0f1115; padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>
<div class="card">
  <h1>🎶 공주님 봇 설정</h1>
  {% if guild_ids %}
    <p>등록된 서버:</p>
    <ul>
      {% for gid in guild_ids %}
        <li><a href="{{ url_for('guild_page', guild_id=gid) }}">{{ gid }}</a></li>
      {% endfor %}
    </ul>
  {% else %}
    <p>아직 등록된 서버 설정이 없습니다. 디스코드에서 <code>!join</code> 또는 <code>!설정</code>을 먼저 실행해주세요.</p>
  {% endif %}
</div>
</body>
</html>
