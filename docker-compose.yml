services:
  utahime-bot:
    build: .
    container_name: utahime-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./playlists.db:/app/playlists.db
      # 배경 제거(rembg) 모델 캐시. 없으면 재빌드/재시작마다 모델(수백MB)을 다시 받는다.
      - ./rembg_models:/root/.u2net

  utahime-web:
    build: .
    container_name: utahime-web
    command: ["python", "web/app.py"]
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5050:5000"
    volumes:
      - ./playlists.db:/app/playlists.db
