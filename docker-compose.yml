services:
  utahime-bot:
    build: .
    container_name: utahime-bot
    restart: unless-stopped
    # 음성(UDP)이 브릿지 네트워크 NAT를 거치며 유실되는 경우가 있어서(시로냥 TTS에서 겪음)
    # 봇 컨테이너만 호스트 네트워크를 쓴다. 포트를 여는 서비스가 아니라 충돌 걱정 없음.
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - ./playlists.db:/app/playlists.db
      # TTS/음성 허브 설정 (data/settings.json)
      - ./data:/app/data

  utahime-web:
    build: .
    container_name: utahime-web
    command: ["python", "web/app.py"]
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5050:5000"
    volumes:
      - ./playlists.db:/app/playlists.db
      # 서버 관리 설정(data/settings.json) — 봇과 같은 파일을 읽고 쓴다
      - ./data:/app/data
